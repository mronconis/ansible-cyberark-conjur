---
- name: Launch Conjur demo job template
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Launch job template
      awx.awx.job_launch:
        job_template: conjur-demo-ping
        wait: true
      register: job

    - name: Show job result
      ansible.builtin.debug:
        msg:
          - "Job ID: {{ job.id }}"
          - "Status: {{ job.status }}"

    - name: Fail if job did not succeed
      ansible.builtin.assert:
        that:
          - job.status == 'successful'
        fail_msg: "Job finished with status {{ job.status }}"
